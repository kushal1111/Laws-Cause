name = "laws-and-cause"
compatibility_date = "2026-10-27"
pages_build_output_dir = "dist"

# Cloudflare's deploy command is `npx wrangler deploy` and does not run a
# separate build. Wrangler runs this command before it checks that dist exists.
[build]
command = "npm run build"

[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
